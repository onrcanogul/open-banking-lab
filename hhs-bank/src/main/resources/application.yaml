spring:
  application:
    name: hhs-bank
  datasource:
    url: jdbc:oracle:thin:@//localhost:1521/FREEPDB1
    username: ${BANK_DB_USER:bank_app}
    password: ${BANK_DB_PASSWORD:bank_app_pw}
    hikari:
      maximum-pool-size: 10
      connection-timeout: 3000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    locations: classpath:db/migration
  kafka:
    consumer:
      auto-offset-reset: earliest      # a fresh consumer group must not skip GKD events produced before its first start

logging:
  pattern:
    correlation: "[%X{requestId:-}] "

server:
  port: 8081
management:
  endpoints:
    web:
      exposure:
        include: "health, info"

ohvps:
  security:
    audience: ohvps-hbh
    clock-skew: 30s
    client-issuer:      # Keycloak: TPP (client_credentials) and internal service tokens
      issuer: ${OHVPS_KEYCLOAK_ISSUER:http://localhost:8080/realms/ohvps-bank}
      jwk-set-uri: ${OHVPS_KEYCLOAK_JWKS:http://localhost:8080/realms/ohvps-bank/protocol/openid-connect/certs}
    customer-issuer:    # auth-simulator: erişim belirteci issued after GKD, carries riza_no
      issuer: ${OHVPS_GKD_ISSUER:http://localhost:8082}
      jwk-set-uri: ${OHVPS_GKD_JWKS:http://localhost:8082/.well-known/jwks.json}

  messaging:
    topics:
      gkd-events: ohvps.gkd.events
      consent-status-changed: ohvps.consent.status-changed

  bank:
    aspsp-code: ${OHVPS_ASPSP_CODE:HHS1}                 # hhsKod, AN4; this lab's own bank code

  gkd:
    # Where the customer is sent for strong authentication (hhsYonAdr); the auth-simulator module will serve it
    redirect-base-url: ${OHVPS_GKD_REDIRECT_BASE_URL:http://localhost:8082/gkd}

---
spring:
  config:
    activate:
      on-profile: dev
  flyway:
    locations: classpath:db/migration,classpath:db/dev-data