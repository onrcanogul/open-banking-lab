<!DOCTYPE html>
<html lang="tr" xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${title}">HHS Bank · GKD</title>
    <style>
        :root { --ink:#1b2430; --muted:#5b6675; --line:#dde3ea; --brand:#0b5d4b; --brand-ink:#fff; --danger:#a12a2a; --bg:#f4f6f8; }
        * { box-sizing:border-box; }
        body { margin:0; font-family:-apple-system, "Segoe UI", Roboto, sans-serif; color:var(--ink); background:var(--bg); }
        header { background:var(--brand); color:var(--brand-ink); padding:14px 20px; font-weight:600; letter-spacing:.2px; }
        main { max-width:560px; margin:28px auto; padding:0 16px; }
        .card { background:#fff; border:1px solid var(--line); border-radius:10px; padding:22px; }
        h1 { font-size:20px; margin:0 0 6px; }
        p.lead { color:var(--muted); margin:0 0 18px; line-height:1.45; }
        dl { display:grid; grid-template-columns:max-content 1fr; gap:6px 14px; margin:0 0 18px; }
        dt { color:var(--muted); }
        dd { margin:0; font-variant-numeric:tabular-nums; }
        h2 { font-size:14px; text-transform:uppercase; letter-spacing:.6px; color:var(--muted); margin:20px 0 8px; }
        ul.perms { margin:0; padding-left:18px; line-height:1.6; }
        label.account { display:flex; gap:10px; align-items:center; padding:10px 12px; border:1px solid var(--line); border-radius:8px; margin-bottom:8px; cursor:pointer; }
        label.account small { color:var(--muted); display:block; }
        .error { background:#fbeaea; color:var(--danger); border-radius:8px; padding:10px 12px; margin-bottom:14px; }
        .actions { display:flex; gap:10px; margin-top:20px; }
        button { flex:1; padding:12px; border-radius:8px; font-size:15px; cursor:pointer; border:1px solid var(--brand); }
        button.primary { background:var(--brand); color:var(--brand-ink); }
        button.secondary { background:#fff; color:var(--brand); }
    </style>
</head>
<body>
<header th:fragment="header">HHS Bank · Güçlü Kimlik Doğrulama</header>
</body>
</html>
